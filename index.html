    <!-- Lightbox Overlay (Standaard verborgen) -->
  <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <div class="lightbox-content">
            <img class="lightbox-img" id="lightbox-img" src="" alt="Vergrote afbeelding">
            <div id="lightbox-caption" class="lightbox-caption"></div> <!-- DIT ELEMENT IS NODIG -->
        </div>
    </div>

    <!-- Eenvoudig script voor de klik-functionaliteit -->
<script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption'); // DIT MOET ER ZIJN
        const triggers = document.querySelectorAll('.lightbox-trigger');
        const closeBtn = document.querySelector('.close-btn');

        triggers.forEach(img => {
            img.addEventListener('click', () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = img.src;
                // Dit zorgt ervoor dat de tekst uit je data-title wordt gehaald en getoond:
                lightboxCaption.textContent = img.getAttribute('data-title'); 
            });
        });

        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });
    </script>

</body>
